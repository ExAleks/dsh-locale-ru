name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle manifest is valid
        run: node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch||!p.dsh?.client) throw new Error('missing dsh bundle/client manifest'); console.log('manifest ok:', p.name)"

      - name: Translation tables parse
        run: |
          node -e "const fs=require('fs'); for (const f of ['translations/ru.json','translations/package-text.ru.json','locale/en.json','locale/ru.json']) { JSON.parse(fs.readFileSync(f,'utf8')); console.log('ok', f); }"

      - name: client.js is valid JavaScript
        run: node --check client.js

      - name: client.js matches the translation sources
        run: node tools/verify-in-sync.mjs .
